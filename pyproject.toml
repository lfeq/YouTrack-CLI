[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[project]
name = "youtrack-cli"
version = "1.0.2"
description = "A cross-platform command-line tool for interacting with YouTrack"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.24.0",
    "tomli; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "respx>=0.20.0",
]

[project.scripts]
youtrack = "youtrack_cli.cli:main"
